---
name: Support question (English)
description: Ask for help with installation, setup, or use.
labels:
- question
body:
- type: markdown
  attributes:
    value: |-
      **This issue and all attachments will be public.** Do not share private activity, health, account, or precise location data, FIT files, complete activity exports, or complete logs. Only add cropped images after removing private information. There is currently no private support channel.

      Please [search existing issues](https://github.com/Usebit/ride-dashboard-support/issues) and read the [support guide](https://github.com/Usebit/ride-dashboard-support/blob/main/support-en.md) first.
- type: textarea
  id: question
  attributes:
    label: Your question
    description: If you selected another device model, name it here.
  validations:
    required: true
- type: dropdown
  id: device-model
  attributes:
    label: Edge model
    options:
    - Edge 1040
    - Edge 1040 Solar
    - Edge 1050
    - Other (specify below)
  validations:
    required: true
- type: textarea
  id: attempted-solutions
  attributes:
    label: What have you already tried?
    description: Describe your attempts, or write "not tried yet".
  validations:
    required: true
- type: input
  id: app-version
  attributes:
    label: Ride Dashboard version
    description: Enter the installed version, or "unknown" if you cannot determine
      it.
    placeholder: 'For example: 1.0.0 or unknown'
  validations:
    required: false
- type: textarea
  id: settings
  attributes:
    label: Relevant settings (optional)
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Public information only
    options:
    - label: I confirm that this issue and its attachments contain no private activity,
        health, account, or precise location data, FIT files, complete activity exports,
        or complete logs.
      required: true
