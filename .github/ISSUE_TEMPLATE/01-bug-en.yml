---
name: Bug report (English)
description: Report a reproducible Ride Dashboard problem.
labels:
- bug
body:
- type: markdown
  attributes:
    value: |-
      **This issue and all attachments will be public.** Do not share private activity, health, account, or precise location data, FIT files, complete activity exports, or complete logs. Only add cropped images after removing private information. There is currently no private support channel.

      Please [search existing issues](https://github.com/Usebit/ride-dashboard-support/issues) and read the [support guide](https://github.com/Usebit/ride-dashboard-support/blob/main/support-en.md) first.
- type: input
  id: app-version
  attributes:
    label: Ride Dashboard version
    description: Enter the installed version, or "unknown" if you cannot determine
      it.
    placeholder: 'For example: 1.0.0 or unknown'
  validations:
    required: true
- type: dropdown
  id: device-model
  attributes:
    label: Edge model
    options:
    - Edge 1040
    - Edge 1040 Solar
    - Other (specify below)
  validations:
    required: true
- type: input
  id: firmware
  attributes:
    label: Firmware version
    description: Enter the Edge firmware version, or "unknown".
    placeholder: Version or unknown
  validations:
    required: true
- type: input
  id: device-language
  attributes:
    label: Device language
  validations:
    required: true
- type: dropdown
  id: units
  attributes:
    label: Units
    options:
    - Metric
    - Imperial
    - Mixed / custom
  validations:
    required: true
- type: dropdown
  id: field-geometry
  attributes:
    label: Data-field layout
    options:
    - Full-width
    - Half-width
    - Other (describe below)
  validations:
    required: true
- type: textarea
  id: settings
  attributes:
    label: Affected values and settings
    description: Include the metric, preset, maximum tile count, additional-strip
      mode/position, and relevant display settings. Specify any other device model
      or layout here.
  validations:
    required: true
- type: textarea
  id: reproduction
  attributes:
    label: Steps to reproduce
    placeholder: |-
      1. Open …
      2. Select …
      3. Observe …
  validations:
    required: true
- type: textarea
  id: expected
  attributes:
    label: Expected behavior
  validations:
    required: true
- type: textarea
  id: actual
  attributes:
    label: Actual behavior
  validations:
    required: true
- type: textarea
  id: sensors
  attributes:
    label: Sensors / electronic shifting (optional)
    description: Models and connection state only; no serial numbers or recordings.
  validations:
    required: false
- type: textarea
  id: screenshots
  attributes:
    label: Cropped screenshots or photos (optional)
    description: Remove private activity, health, account, and precise location data
      before attaching an image.
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Public information only
    options:
    - label: I confirm that this issue and its attachments contain no private activity,
        health, account, or precise location data, FIT files, complete activity exports,
        or complete logs.
      required: true
