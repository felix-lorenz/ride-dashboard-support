---
name: Feature request (English)
description: Suggest an improvement and explain the use case.
labels:
- enhancement
body:
- type: markdown
  attributes:
    value: |-
      **This issue and all attachments will be public.** Do not share private activity, health, account, or precise location data, FIT files, complete activity exports, or complete logs. Only add cropped images after removing private information. There is currently no private support channel.

      Please [search existing issues](https://github.com/Usebit/ride-dashboard-support/issues) and read the [support guide](https://github.com/Usebit/ride-dashboard-support/blob/main/support-en.md) first.
- type: textarea
  id: use-case
  attributes:
    label: Use case / problem
  validations:
    required: true
- type: textarea
  id: desired-behavior
  attributes:
    label: Desired behavior
  validations:
    required: true
- type: textarea
  id: alternatives
  attributes:
    label: Alternatives (optional)
  validations:
    required: false
- type: checkboxes
  id: privacy
  attributes:
    label: Public information only
    options:
    - label: I confirm that this issue and its attachments contain no private activity,
        health, account, or precise location data, FIT files, complete activity exports,
        or complete logs.
      required: true
